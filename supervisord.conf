[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; ── Process 1: FastAPI server via uvicorn ─────────────────────────────────────
; Decision: 1 worker, not 4 (Pi has 4 cores)
;   Multiple uvicorn workers each have their own Python process and memory.
;   The in-memory session state in routes/transcript.py would not be shared
;   across workers — one worker processes the transcript, a different worker
;   might serve the dashboard poll, and it sees an empty session.
;   Fix would require Redis or a database. For a single-user tool, 1 worker
;   is correct, simpler, and uses less RAM (~40 MB vs ~160 MB for 4 workers).
;
; Decision: --no-access-log
;   The dashboard polls /api/transcript/pending every 3 seconds.
;   With access logging on, that's 20 log lines per minute of noise.
;   Errors still appear via uvicorn's error logger.
[program:server]
command=/opt/venv/bin/uvicorn main:app
        --host 0.0.0.0
        --port %(ENV_PORT)s
        --workers 1
        --no-access-log
        --log-level info
directory=/app
autostart=true
autorestart=true
startretries=5
startsecs=4
stdout_logfile=/var/log/supervisor/server.log
stdout_logfile_maxbytes=5MB
stderr_logfile=/var/log/supervisor/server-err.log
environment=PYTHONUNBUFFERED="1"

; ── Process 2: Worker (mock watcher or real dashboard-triggered recorder) ─────
; Decision: separate process, not a FastAPI background task
;   The worker runs forever (infinite loop watching for audio/files).
;   A FastAPI background task is tied to the request lifecycle — it's
;   for short async work, not long-running loops. A separate supervisor
;   process gets its own PID, restart policy, and log file.
[program:worker]
command=bash /scripts/start-worker.sh
directory=/app
autostart=true
autorestart=true
startretries=5
startsecs=5
stdout_logfile=/var/log/supervisor/worker.log
stdout_logfile_maxbytes=5MB
stderr_logfile=/var/log/supervisor/worker-err.log
environment=PYTHONUNBUFFERED="1",PA_ALSA_PLUGHW="1"
